spring.application.name=tft-stats

# CONFIGURACOES DO POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tft_stats
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACOES DO HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.json.mapper.class=com.fasterxml.jackson.databind.ObjectMapper

server.port=8080

riot.api.key=${RIOT_API_KEY}